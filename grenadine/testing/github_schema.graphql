# The slice of GitHub's GraphQL schema that grenadine's server queries. Field
# and type names follow https://docs.github.com/en/graphql so that a query that
# works here works on GitHub. Fields are nullable where GitHub's are not when
# that keeps one failing alias from nulling out the whole response.

scalar DateTime
scalar URI
scalar GitObjectID

type Query {
  search(type: SearchType!, query: String!, first: Int, after: String): SearchResultItemConnection
  repository(owner: String!, name: String!): Repository
  organization(login: String!): Organization
  user(login: String!): User
  viewer: User!
  rateLimit: RateLimit
}

type Organization {
  teams(query: String, first: Int, after: String): TeamConnection!
}

type TeamConnection {
  nodes: [Team]
}

type RateLimit {
  cost: Int!
  limit: Int!
  nodeCount: Int!
  remaining: Int!
  resetAt: DateTime!
  used: Int!
}

# Each mutation's payload only offers clientMutationId: grenadine resyncs the
# PR after a change rather than reading the payload.
type Mutation {
  addComment(input: AddCommentInput!): MutationPayload
  addPullRequestReviewThreadReply(
    input: AddPullRequestReviewThreadReplyInput!
  ): MutationPayload
  resolveReviewThread(input: ResolveReviewThreadInput!): MutationPayload
  unresolveReviewThread(input: UnresolveReviewThreadInput!): MutationPayload
  addPullRequestReview(input: AddPullRequestReviewInput!): AddPullRequestReviewPayload
  addPullRequestReviewThread(
    input: AddPullRequestReviewThreadInput!
  ): MutationPayload
  updatePullRequestReviewComment(
    input: UpdatePullRequestReviewCommentInput!
  ): MutationPayload
  deletePullRequestReviewComment(
    input: DeletePullRequestReviewCommentInput!
  ): MutationPayload
  submitPullRequestReview(input: SubmitPullRequestReviewInput!): MutationPayload
  deletePullRequestReview(input: DeletePullRequestReviewInput!): MutationPayload
  mergePullRequest(input: MergePullRequestInput!): MutationPayload
  enqueuePullRequest(input: EnqueuePullRequestInput!): MutationPayload
  dequeuePullRequest(input: DequeuePullRequestInput!): MutationPayload
  enablePullRequestAutoMerge(
    input: EnablePullRequestAutoMergeInput!
  ): MutationPayload
  disablePullRequestAutoMerge(
    input: DisablePullRequestAutoMergeInput!
  ): MutationPayload
  updatePullRequest(input: UpdatePullRequestInput!): MutationPayload
  closePullRequest(input: ClosePullRequestInput!): MutationPayload
  deleteRef(input: DeleteRefInput!): MutationPayload
}

input UpdatePullRequestInput {
  pullRequestId: ID!
  baseRefName: String
  clientMutationId: String
}

input ClosePullRequestInput {
  pullRequestId: ID!
  clientMutationId: String
}

input MergePullRequestInput {
  pullRequestId: ID!
  mergeMethod: PullRequestMergeMethod
  expectedHeadOid: GitObjectID
  commitHeadline: String
  commitBody: String
  clientMutationId: String
}

input EnqueuePullRequestInput {
  pullRequestId: ID!
  expectedHeadOid: GitObjectID
  jump: Boolean
  clientMutationId: String
}

input DequeuePullRequestInput {
  id: ID!
  clientMutationId: String
}

input EnablePullRequestAutoMergeInput {
  pullRequestId: ID!
  expectedHeadOid: GitObjectID
  clientMutationId: String
}

input DisablePullRequestAutoMergeInput {
  pullRequestId: ID!
  clientMutationId: String
}

type MergeQueue {
  configuration: MergeQueueConfiguration
}

type MergeQueueConfiguration {
  mergeMethod: PullRequestMergeMethod
}

enum MergeQueueEntryState {
  AWAITING_CHECKS
  LOCKED
  MERGEABLE
  QUEUED
  UNMERGEABLE
}

type MergeQueueEntry {
  position: Int!
  state: MergeQueueEntryState!
  jump: Boolean!
}

type PullRequestStack {
  number: Int!
  baseRefName: String!
  size: Int!
  entries(first: Int): PullRequestStackEntryConnection
}

type PullRequestStackEntryConnection {
  nodes: [PullRequestStackEntry]
}

type PullRequestStackEntry {
  position: Int!
  pullRequest: PullRequest!
}

type AutoMergeRequest {
  enabledAt: DateTime
  enabledBy: Actor
}

input DeleteRefInput {
  refId: ID!
  clientMutationId: String
}

type Ref {
  id: ID!
  name: String!
  refUpdateRule: RefUpdateRule
  rules(first: Int): RepositoryRuleConnection
}

type RefUpdateRule {
  requiresConversationResolution: Boolean!
}

type RepositoryRuleConnection {
  nodes: [RepositoryRule]
}

type RepositoryRule {
  parameters: RuleParameters
}

union RuleParameters = PullRequestParameters

type PullRequestParameters {
  requiredReviewThreadResolution: Boolean!
}

type AddPullRequestReviewPayload {
  clientMutationId: String
  pullRequestReview: PullRequestReview
}

enum PullRequestReviewEvent {
  COMMENT
  APPROVE
  REQUEST_CHANGES
  DISMISS
}

enum DiffSide {
  LEFT
  RIGHT
}

enum PullRequestReviewThreadSubjectType {
  LINE
  FILE
}

input AddPullRequestReviewInput {
  pullRequestId: ID!
  event: PullRequestReviewEvent
  body: String
  threads: [DraftPullRequestReviewThread]
  clientMutationId: String
}

input DraftPullRequestReviewThread {
  path: String
  line: Int
  side: DiffSide
  startLine: Int
  startSide: DiffSide
  body: String!
}

input AddPullRequestReviewThreadInput {
  pullRequestReviewId: ID
  path: String!
  body: String!
  line: Int
  side: DiffSide
  subjectType: PullRequestReviewThreadSubjectType
  clientMutationId: String
}

input UpdatePullRequestReviewCommentInput {
  pullRequestReviewCommentId: ID!
  body: String!
  clientMutationId: String
}

input DeletePullRequestReviewCommentInput {
  id: ID!
  clientMutationId: String
}

input SubmitPullRequestReviewInput {
  pullRequestReviewId: ID
  event: PullRequestReviewEvent!
  body: String
  clientMutationId: String
}

input DeletePullRequestReviewInput {
  pullRequestReviewId: ID!
  clientMutationId: String
}

type MutationPayload {
  clientMutationId: String
}

input AddCommentInput {
  subjectId: ID!
  body: String!
  clientMutationId: String
}

input AddPullRequestReviewThreadReplyInput {
  pullRequestReviewThreadId: ID!
  body: String!
  pullRequestReviewId: ID
  clientMutationId: String
}

input ResolveReviewThreadInput {
  threadId: ID!
  clientMutationId: String
}

input UnresolveReviewThreadInput {
  threadId: ID!
  clientMutationId: String
}

enum SearchType {
  ISSUE
  ISSUE_ADVANCED
  REPOSITORY
  USER
}

type SearchResultItemConnection {
  issueCount: Int!
  pageInfo: PageInfo!
  nodes: [SearchResultItem]
}

union SearchResultItem = Issue | PullRequest

type Issue {
  number: Int!
  title: String!
}

type Repository {
  nameWithOwner: String!
  isArchived: Boolean!
  pullRequest(number: Int!): PullRequest
  pullRequests(
    headRefName: String
    baseRefName: String
    states: [PullRequestState!]
    first: Int
    after: String
  ): PullRequestConnection!
  object(oid: GitObjectID, expression: String): GitObject
  mergeCommitAllowed: Boolean!
  squashMergeAllowed: Boolean!
  rebaseMergeAllowed: Boolean!
  viewerDefaultMergeMethod: PullRequestMergeMethod!
  deleteBranchOnMerge: Boolean!
  assignableUsers(query: String, first: Int, after: String): UserConnection!
}

type UserConnection {
  nodes: [User]
}

enum PullRequestMergeMethod {
  MERGE
  SQUASH
  REBASE
}

enum PullRequestReviewDecision {
  APPROVED
  CHANGES_REQUESTED
  REVIEW_REQUIRED
}

enum MergeStateStatus {
  BEHIND
  BLOCKED
  CLEAN
  DIRTY
  DRAFT
  HAS_HOOKS
  UNKNOWN
  UNSTABLE
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

enum MergeableState {
  MERGEABLE
  CONFLICTING
  UNKNOWN
}

type PullRequestConnection {
  nodes: [PullRequest]
}

type PullRequest {
  id: ID!
  number: Int!
  title: String!
  body: String!
  url: URI!
  state: PullRequestState!
  mergeable: MergeableState!
  isDraft: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  mergedAt: DateTime
  author: Actor
  repository: Repository!
  baseRefName: String!
  baseRefOid: GitObjectID!
  baseRef: Ref
  headRefName: String!
  headRefOid: GitObjectID!
  headRef: Ref
  headRepository: Repository
  isCrossRepository: Boolean!
  timelineItems(
    first: Int
    after: String
    itemTypes: [PullRequestTimelineItemsItemType!]
  ): PullRequestTimelineItemsConnection!
  commits(first: Int, after: String, last: Int): PullRequestCommitConnection!
  reviewThreads(first: Int, after: String): PullRequestReviewThreadConnection!
  isInMergeQueue: Boolean!
  isMergeQueueEnabled: Boolean!
  mergeQueue: MergeQueue
  mergeQueueEntry: MergeQueueEntry
  stack: PullRequestStack
  stackEntry: PullRequestStackEntry
  autoMergeRequest: AutoMergeRequest
  viewerCanEnableAutoMerge: Boolean!
  viewerCanDisableAutoMerge: Boolean!
  reviewDecision: PullRequestReviewDecision
  mergeStateStatus: MergeStateStatus!
  viewerCanMergeAsAdmin: Boolean!
  viewerCanUpdate: Boolean!
  suggestedReviewers(first: Int): SuggestedReviewerConnection
  reviews(
    first: Int
    after: String
    last: Int
    states: [PullRequestReviewState!]
  ): PullRequestReviewConnection
  reviewRequests(first: Int, after: String): ReviewRequestConnection
  comments(first: Int, after: String, last: Int): IssueCommentConnection!
}

enum PullRequestReviewState {
  PENDING
  COMMENTED
  APPROVED
  CHANGES_REQUESTED
  DISMISSED
}

type PullRequestReviewConnection {
  nodes: [PullRequestReview]
}

type PullRequestReview {
  id: ID!
  viewerDidAuthor: Boolean!
  comments(first: Int, after: String): PullRequestReviewCommentConnection!
  state: PullRequestReviewState!
  body: String!
  submittedAt: DateTime
  url: URI!
  commit: Commit
  author: Actor
}

type ReviewRequestConnection {
  nodes: [ReviewRequest]
}

type ReviewRequest {
  requestedReviewer: RequestedReviewer
}

union RequestedReviewer = User | Team | Bot | Mannequin

type Team {
  name: String!
  slug: String!
}

type SuggestedReviewerConnection {
  nodes: [SuggestedReviewer]
}

type SuggestedReviewer {
  isAuthor: Boolean!
  isCommenter: Boolean!
  reviewer: User!
}

type IssueCommentConnection {
  nodes: [IssueComment]
}

type IssueComment {
  body: String!
  createdAt: DateTime!
  url: URI!
  author: Actor
}

enum PullRequestTimelineItemsItemType {
  HEAD_REF_FORCE_PUSHED_EVENT
  PULL_REQUEST_COMMIT
}

type PullRequestTimelineItemsConnection {
  nodes: [PullRequestTimelineItems]
}

union PullRequestTimelineItems = HeadRefForcePushedEvent | PullRequestCommit

type HeadRefForcePushedEvent {
  createdAt: DateTime!
  actor: Actor
  beforeCommit: Commit
  afterCommit: Commit
}

type PullRequestCommitConnection {
  nodes: [PullRequestCommit]
}

type PullRequestCommit {
  commit: Commit!
}

interface GitObject {
  oid: GitObjectID!
}

type Commit implements GitObject {
  oid: GitObjectID!
  author: GitActor
  checkSuites(first: Int, after: String): CheckSuiteConnection
  statusCheckRollup: StatusCheckRollup
}

type StatusCheckRollup {
  state: StatusState!
  contexts(first: Int, after: String): StatusCheckRollupContextConnection!
}

type StatusCheckRollupContextConnection {
  nodes: [StatusCheckRollupContext]
}

union StatusCheckRollupContext = CheckRun | StatusContext

type CheckRun {
  name: String!
  status: CheckStatusState!
  conclusion: CheckConclusionState
  detailsUrl: URI
  startedAt: DateTime
  checkSuite: CheckSuite
}

enum CheckStatusState {
  QUEUED
  IN_PROGRESS
  COMPLETED
  WAITING
  PENDING
  REQUESTED
}

enum CheckConclusionState {
  ACTION_REQUIRED
  TIMED_OUT
  CANCELLED
  FAILURE
  SUCCESS
  NEUTRAL
  SKIPPED
  STARTUP_FAILURE
  STALE
}

type StatusContext {
  context: String!
  state: StatusState!
  targetUrl: URI
}

enum StatusState {
  EXPECTED
  ERROR
  FAILURE
  PENDING
  SUCCESS
}

type GitActor {
  name: String
  email: String
  user: User
}

type CheckSuiteConnection {
  nodes: [CheckSuite]
}

type CheckSuite {
  createdAt: DateTime!
  workflowRun: WorkflowRun
}

type WorkflowRun {
  workflow: Workflow!
}

type Workflow {
  name: String!
}

interface Actor {
  login: String!
  avatarUrl: URI
}

type User implements Actor {
  login: String!
  avatarUrl: URI
  name: String
}

type Bot implements Actor {
  login: String!
  avatarUrl: URI
}

type Mannequin implements Actor {
  login: String!
  avatarUrl: URI
}

type PullRequestReviewThreadConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  nodes: [PullRequestReviewThread]
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type PullRequestReviewThread {
  id: ID!
  diffSide: DiffSide!
  isResolved: Boolean!
  viewerCanResolve: Boolean!
  viewerCanUnresolve: Boolean!
  resolvedBy: User
  comments(first: Int, after: String): PullRequestReviewCommentConnection!
}

type PullRequestReviewCommentConnection {
  nodes: [PullRequestReviewComment]
  totalCount: Int!
}

type PullRequestReviewComment {
  id: ID!
  databaseId: Int
  body: String!
  path: String!
  line: Int
  startLine: Int
  originalLine: Int
  originalStartLine: Int
  subjectType: PullRequestReviewThreadSubjectType!
  createdAt: DateTime!
  url: URI!
  replyTo: PullRequestReviewComment
  originalCommit: Commit
}
