name: Test

on:
  pull_request:
  # Runs on main fill the caches that PR runs can read.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Empty in runs for PRs from forks, which don't get the repository's
      # secrets. Those runs build without BuildBuddy.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Ubuntu 24.04 blocks unprivileged user namespaces, which the
      # linux-sandbox that .bazelrc forces needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # The disk cache only helps runs without BuildBuddy's remote cache.
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && github.workflow }}
          repository-cache: true
      - if: env.BUILDBUDDY_API_KEY != ''
        run: |
          cat > .bazelrc.user <<EOF
          build --config=remote
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          build --bes_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF
      # The step below reads local file:// paths from bep.json. With
      # BuildBuddy, Bazel would write bytestream:// URIs there instead.
      - run: bazel test --build_event_json_file=bep.json --nobuild_event_json_file_path_conversion //...
      # Collect the logs and outputs of the tests that didn't pass.
      - if: failure()
        run: |
          testlogs=$(bazel info bazel-testlogs)
          jq -r 'select(.id.testResult and .testResult.status != "PASSED")
              | .testResult.testActionOutput[] | select(.name == "test.log") | .uri' bep.json \
            | sed 's|^file://||' \
            | while read -r log; do
                dir=$(dirname "$log")
                dest="failed-testlogs/${dir#"$testlogs"/}"
                mkdir -p "$dest"
                cp -rL "$dir"/. "$dest"
              done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-testlogs
          path: failed-testlogs
          if-no-files-found: ignore
